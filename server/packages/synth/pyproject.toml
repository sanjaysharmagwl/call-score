[project]
name = "callscore-synth"
version = "0.1.0"
description = "Synthetic data generator for callscore (securities, analysts, ratings)."

readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "callscore-core>=0.1.0",
    "callscore-store>=0.1.0",
    "numpy>=2.0",
]

[project.scripts]
callscore-synth = "callscore_synth.cli:main"

[tool.uv.sources]
callscore-core = { workspace = true }
callscore-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callscore_synth"]
