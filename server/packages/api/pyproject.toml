[project]
name = "callscore-api"
version = "0.1.0"
description = "FastAPI backend for callscore."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "callscore-core>=0.1.0",
    "callscore-store>=0.1.0",
    "callscore-engine>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
callscore-core = { workspace = true }
callscore-store = { workspace = true }
callscore-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callscore_api"]
