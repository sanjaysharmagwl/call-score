[project]
name = "callscore-engine"
version = "0.1.0"
description = "Pure scoring engine for callscore: a function of data + methodology, no I/O."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "callscore-calc>=0.2,<0.3",
    "callscore-core>=0.1.0",
    "polars>=1.44,<2",
]

[tool.uv.sources]
callscore-calc = { workspace = true }
callscore-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callscore_engine"]
