[project]
name = "callscore-store"
version = "0.1.0"
description = "SQLite/SQLAlchemy persistence layer for callscore."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "callscore-core>=0.1.0",
    "polars>=1.44,<2",
    "sqlalchemy>=2.0",
]

[tool.uv.sources]
callscore-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callscore_store"]
