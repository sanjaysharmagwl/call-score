[project]
name = "callscore-calc-whatif"
version = "0.1.0"
description = "What-if analysis plugin for callscore-calc: overrides, shocks, formula columns and saved, hash-chained scenarios."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sanjay Sharma", email = "sanjaysharmagwl@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "callscore-calc>=0.2,<0.3",
    "polars>=1.44,<2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
fastapi = ["callscore-calc[fastapi]>=0.2,<0.3"]
redis = ["redis>=5"]

[project.entry-points."callscore_calc.plugins"]
whatif = "callscore_calc_whatif:WhatIfPlugin"

[tool.uv.sources]
callscore-calc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callscore_calc_whatif"]
